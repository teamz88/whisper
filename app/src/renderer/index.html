<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src allows the Vite HMR websocket in dev; the renderer itself
         performs no network calls (all API traffic goes through main). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Whisper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
